<text x="70" y="96" class="t">A CA FIRM ON ONE BRAIN</text>
<text x="1530" y="96" class="s d" text-anchor="end">the whole practice · brain map</text>

<text x="70" y="262" class="sec">01 / THE SYSTEM</text>
<text x="1530" y="262" class="s d" text-anchor="end">you speak plainly · the agent reads its skills · the brain keeps the facts</text>
<rect x="70" y="298" width="340" height="160" class="bx"/>
<text x="92" y="340" class="h">YOU</text>
<text x="92" y="368" class="s d">partner · manager · article</text>

<text x="1211" y="432" class="s">files, pays · not the brain</text>

<text x="979" y="752" class="xs">· onboarding kits, MIS packs</text>

<text x="94" y="2144" class="lab">KNOWLEDGE · concepts/</text>

<text x="94" y="2207" class="s">positions/   the stand we take, when, why · who approved it</text>

<text x="94" y="2261" class="s">checklists/  per service: GSTR-3B, TDS, ITR, audit, ROC</text>

<text x="94" y="2315" class="s"></text>
