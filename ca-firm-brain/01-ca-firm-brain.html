<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="tip"/></marker></defs>
<text x="70" y="96" class="t">A CA FIRM ON ONE BRAIN</text>
<text x="1530" y="96" class="s d" text-anchor="end">built on gbrain · open source, MIT</text>
<text x="70" y="140" class="sub">clients, work, knowledge, templates and strategy in one memory an agent can read and write,</text>
<text x="70" y="170" class="sub">so no due date, position, template version or client fact depends on one person remembering</text>
<line x1="70" y1="204" x2="1530" y2="204" class="rule-fg"/>
<text x="70" y="262" class="sec">01 / THE SYSTEM</text>
<text x="1530" y="262" class="s d" text-anchor="end">you speak plainly · the agent reads its skills · the brain keeps the facts</text>
<rect x="70" y="298" width="340" height="160" class="bx"/>
<text x="92" y="340" class="h">YOU</text>
<text x="92" y="368" class="s d">partner · manager · article</text>
<text x="92" y="406" class="s">forward, ask, assign,</text>
<text x="92" y="432" class="s">review, say yes or no</text>
<path d="M413,378 H438" class="ln" marker-end="url(#ah)"/>
<rect x="443" y="298" width="340" height="160" class="bx-agent"/>
<text x="465" y="340" class="h agent">THE AGENT</text>
<text x="465" y="368" class="s d">reads skill files first</text>
<text x="465" y="406" class="s">drafts, files pages, fills</text>
<text x="465" y="432" class="s">templates · never sends alone</text>
<path d="M786,378 H811" class="ln" marker-end="url(#ah)"/>
<rect x="816" y="298" width="340" height="160" class="bx-brain"/>
<text x="838" y="340" class="h brain">THE BRAIN</text>
<text x="838" y="368" class="s d">pages + graph + timeline</text>
<text x="838" y="406" class="s">hybrid search over markdown</text>
<text x="838" y="432" class="s">typed links made on save</text>
<path d="M1159,378 H1184" class="ln" marker-end="url(#ah)"/>
<rect x="1189" y="298" width="340" height="160" class="bx"/>
<text x="1211" y="340" class="h">YOUR TOOLS</text>
<text x="1211" y="368" class="s d">email · portals · tally · dms</text>
<text x="1211" y="406" class="s">a person presses send,</text>
<text x="1211" y="432" class="s">files, pays · not the brain</text>
<text x="70" y="532" class="sec">02 / WHAT POWERS IT · GBRAIN</text>
<text x="1530" y="532" class="s d" text-anchor="end">the engine under the poster · every item below is a shipped command or module</text>
<rect x="70" y="568" width="466" height="266" class="bx-brain"/>
<text x="90" y="606" class="h">ENGINES + STORAGE</text>
<text x="90" y="630" class="s d">pglite · postgres + pgvector</text>
<text x="90" y="662" class="xs">· PGLite: embedded Postgres in one file, no server</text>
<text x="90" y="684" class="xs">· Postgres + pgvector for scale: Supabase or own</text>
<text x="90" y="706" class="xs">· gbrain migrate --to supabase | pglite, both ways</text>
<text x="90" y="728" class="xs">· markdown is the source of truth, DB is the index</text>
<text x="90" y="750" class="xs">· page versions kept · gbrain revert to any one</text>
<text x="90" y="772" class="xs">· raw data store for exports, files, attachments</text>
<text x="90" y="794" class="xs">· S3, Supabase Storage or local disk for files</text>
<rect x="566" y="568" width="466" height="266" class="bx-brain"/>
<text x="586" y="606" class="h">SEARCH</text>
<text x="586" y="630" class="s d">hybrid · graph-aware · measurable</text>
<text x="586" y="662" class="xs">· keyword + vector fused by reciprocal rank fusion</text>
<text x="586" y="684" class="xs">· intent classifier: entity, time, event, general</text>
<text x="586" y="706" class="xs">· multi-query expansion, backlink boost, dedup</text>
<text x="586" y="728" class="xs">· keyword-only mode needs no API key at all</text>
<text x="586" y="750" class="xs">· gbrain eval: precision, recall, MRR, nDCG on</text>
<text x="586" y="772" class="xs">  your own 20 questions, A/B two configs</text>
<text x="586" y="794" class="xs">· published benchmark: recall@5 83% to 95%</text>
<rect x="1062" y="568" width="466" height="266" class="bx-brain"/>
<text x="1082" y="606" class="h">KNOWLEDGE GRAPH</text>
<text x="1082" y="630" class="s d">typed links · timeline · zero LLM</text>
<text x="1082" y="662" class="xs">· every page save extracts links: works_at,</text>
<text x="1082" y="684" class="xs">  advises, attended, source, mentions, founded</text>
<text x="1082" y="706" class="xs">· dated timeline entries per company and person</text>
<text x="1082" y="728" class="xs">· gbrain graph-query &lt;slug&gt; --depth 2 --type T</text>
<text x="1082" y="750" class="xs">· gbrain orphans: pages nobody links to</text>
<text x="1082" y="772" class="xs">· backlink checker and fixer, dead-link audit</text>
<text x="1082" y="794" class="xs">· gbrain extract links|timeline over fs or db</text>
<rect x="70" y="856" width="466" height="266" class="bx-agent"/>
<text x="90" y="894" class="h">AGENT SURFACE</text>
<text x="90" y="918" class="s d">one contract · cli + mcp · 26 skills</text>
<text x="90" y="950" class="xs">· 41 operations defined once, CLI and MCP</text>
<text x="90" y="972" class="xs">  server both generated from that contract</text>
<text x="90" y="994" class="xs">· MCP over stdio for Claude Code, Cursor, any</text>
<text x="90" y="1016" class="xs">  client · remote MCP with bearer tokens</text>
<text x="90" y="1038" class="xs">· 26 skills: brain-ops, query, enrich, meeting-</text>
<text x="90" y="1060" class="xs">  ingestion, citation-fixer, maintain, reports,</text>
<text x="90" y="1082" class="xs">  cron-scheduler, data-research, soul-audit</text>
<rect x="566" y="856" width="466" height="266" class="bx-in"/>
<text x="586" y="894" class="h">INGESTION</text>
<text x="586" y="918" class="s d">files · folders · audio · recipes</text>
<text x="586" y="950" class="xs">· gbrain import &lt;dir&gt; with resume and workers</text>
<text x="586" y="972" class="xs">· live sync: a watched folder stays indexed</text>
<text x="586" y="994" class="xs">· 3-tier chunking: recursive, semantic, LLM-guided</text>
<text x="586" y="1016" class="xs">· audio transcription: Groq Whisper or OpenAI</text>
<text x="586" y="1038" class="xs">· recipes: email, calendar, meetings, X, voice</text>
<text x="586" y="1060" class="xs">· file upload with path confinement for agents</text>
<text x="586" y="1082" class="xs">· data-research: YAML recipe, email to tracker</text>
<rect x="1062" y="856" width="466" height="266" class="bx-agent"/>
<text x="1082" y="894" class="h">OPERATIONS</text>
<text x="1082" y="918" class="s d">runs itself · checks itself</text>
<text x="1082" y="950" class="xs">· gbrain autopilot --install: sync, extract, embed</text>
<text x="1082" y="972" class="xs">· Minions job queue: retries, backoff, timeouts,</text>
<text x="1082" y="994" class="xs">  parent-child fan-out, stall rescue, idempotency</text>
<text x="1082" y="1016" class="xs">· gbrain doctor --fix: health checks, auto-repair</text>
<text x="1082" y="1038" class="xs">· brain score 0-100: embeds, links, time, orphans</text>
<text x="1082" y="1060" class="xs">· gbrain upgrade with migrations + a repair trail</text>
<text x="1082" y="1082" class="xs">· lint, publish --password (encrypted HTML page)</text>
<rect x="70" y="1138" width="1460" height="84" class="ex"/>
<text x="92" y="1168" class="s">gbrain init  ·  gbrain import ./brain  ·  gbrain query &quot;open notices this quarter&quot;  ·  gbrain graph-query widget-traders --depth 2</text>
<text x="92" y="1198" class="s">gbrain autopilot --install  ·  gbrain jobs submit  ·  gbrain doctor --fix  ·  gbrain eval  ·  gbrain serve  (MCP for the agent)</text>
<text x="70" y="1296" class="sec">03 / WHAT THE BRAIN HOLDS</text>
<text x="1530" y="1296" class="s d" text-anchor="end">five domains · one primary home per fact · the folder decides the page type</text>
<rect x="70" y="1332" width="272" height="276" class="bx-brain"/>
<text x="88" y="1372" class="h brain">CLIENTS</text>
<text x="88" y="1398" class="s d">companies/ · people/</text>
<line x1="88" y1="1416" x2="324" y2="1416" class="rule"/>
<text x="88" y="1444" class="xs">· entity master: PAN, GSTIN,</text>
<text x="88" y="1468" class="xs">  FY, registrations</text>
<text x="88" y="1492" class="xs">· services engaged + fees</text>
<text x="88" y="1516" class="xs">· contacts and their roles</text>
<text x="88" y="1540" class="xs">· risk tier, history, notes</text>
<text x="88" y="1564" class="xs">· every notice, filing, call</text>
<rect x="367" y="1332" width="272" height="276" class="bx-agent"/>
<text x="385" y="1372" class="h agent">WORK</text>
<text x="385" y="1398" class="s d">projects/ · tasks/</text>
<line x1="385" y1="1416" x2="621" y2="1416" class="rule"/>
<text x="385" y="1444" class="xs">· one page per engagement</text>
<text x="385" y="1468" class="xs">· recurring compliance jobs</text>
<text x="385" y="1492" class="xs">· tasks: owner, due, status</text>
<text x="385" y="1516" class="xs">· checklists ticked per job</text>
<text x="385" y="1540" class="xs">· review gates and sign-off</text>
<text x="385" y="1564" class="xs">· billing note when done</text>
<rect x="664" y="1332" width="272" height="276" class="bx-brain"/>
<text x="682" y="1372" class="h brain">KNOWLEDGE</text>
<text x="682" y="1398" class="s d">concepts/</text>
<line x1="682" y1="1416" x2="918" y2="1416" class="rule"/>
<text x="682" y="1444" class="xs">· acts, rules, circulars</text>
<text x="682" y="1468" class="xs">· the firm&#x27;s own positions</text>
<text x="682" y="1492" class="xs">· SOPs: how we do each job</text>
<text x="682" y="1516" class="xs">· checklists per service</text>
<text x="682" y="1540" class="xs">· past rulings relied on</text>
<text x="682" y="1564" class="xs">· lessons from corrections</text>
<rect x="961" y="1332" width="272" height="276" class="bx-brain"/>
<text x="979" y="1372" class="h brain">TEMPLATES</text>
<text x="979" y="1398" class="s d">templates/</text>
<line x1="979" y1="1416" x2="1215" y2="1416" class="rule"/>
<text x="979" y="1444" class="xs">· engagement letters</text>
<text x="979" y="1468" class="xs">· reply and representation</text>
<text x="979" y="1492" class="xs">  formats, audit reports</text>
<text x="979" y="1516" class="xs">· onboarding kits, MIS packs</text>
<text x="979" y="1540" class="xs">· one page per template:</text>
<text x="979" y="1564" class="xs">  version, use, owner</text>
<rect x="1258" y="1332" width="272" height="276" class="bx-gate"/>
<text x="1276" y="1372" class="h gate">STRATEGY</text>
<text x="1276" y="1398" class="s d">strategy/ (partner only)</text>
<line x1="1276" y1="1416" x2="1512" y2="1416" class="rule"/>
<text x="1276" y="1444" class="xs">· firm goals, service mix</text>
<text x="1276" y="1468" class="xs">· pricing + fee realisation</text>
<text x="1276" y="1492" class="xs">· client profitability</text>
<text x="1276" y="1516" class="xs">· staffing and capacity</text>
<text x="1276" y="1540" class="xs">· growth and referral plan</text>
<text x="1276" y="1564" class="xs">· decisions and why</text>
<text x="70" y="1642" class="s d">also: meetings/ one page per call · finance/ rates and due-date calendars · sources/ raw files, never edited · inbox/ unplaced items</text>
<text x="70" y="1670" class="xs d">companies, people, projects, concepts, meetings, finance and sources auto-link out of the box</text>
<text x="70" y="1692" class="xs d">tasks/, templates/ and strategy/ are the firm&#x27;s own folders · one pattern line makes them link the same way</text>

<text x="70" y="2832" class="sec">06 / KNOWLEDGE + TEMPLATE STRATEGY</text>
<text x="1530" y="2832" class="s d" text-anchor="end">the firm&#x27;s way of working, written once, used by every job</text>
<rect x="70" y="2868" width="720" height="330" class="bx-brain"/>
<text x="94" y="2908" class="lab">KNOWLEDGE · concepts/</text>
<text x="94" y="2944" class="s">law/         sections, rules, circulars · with source + date checked</text>
<text x="94" y="2971" class="s">positions/   the stand we take, when, why · who approved it</text>
<text x="94" y="2998" class="s">sops/        how we onboard, run an audit, reply to a notice</text>
<text x="94" y="3025" class="s">checklists/  per service: GSTR-3B, TDS, ITR, audit, ROC</text>
<text x="94" y="3052" class="s">lessons/     every correction a CA makes becomes a line here</text>
<text x="94" y="3079" class="s"></text>
<text x="94" y="3106" class="s">a page says &#x27;not covered&#x27; when the firm has no position yet</text>
<text x="94" y="3133" class="s">stale check: anything older than its review date is flagged</text>
<text x="94" y="3176" class="xs d">the agent reads these before drafting · the draft cites the page it used</text>
<rect x="830" y="2868" width="700" height="330" class="bx-brain"/>
<text x="854" y="2908" class="lab">TEMPLATES · templates/ · one page per template</text>
<text x="854" y="2944" class="s">engagement-letter      v3 · use: new client · owner: partner</text>
<text x="854" y="2971" class="s">client-query-gst       v2 · use: 2B mismatch · owner: manager</text>
<text x="854" y="2998" class="s">asmt-10-reply          v4 · use: 3B vs 2B notice · reviewed sep</text>
<text x="854" y="3025" class="s">audit-report-pvt       v6 · use: pvt ltd audit · reviewed apr</text>
<text x="854" y="3052" class="s">representation-letter  v2 · use: every audit · owner: partner</text>
<text x="854" y="3079" class="s">monthly-mis            v1 · use: retainer clients · owner: m</text>
<text x="854" y="3106" class="s"></text>
<text x="854" y="3133" class="s">the agent fills a template from the client page, never by hand</text>
<text x="854" y="3176" class="xs d">a change a CA makes twice becomes the next version · usage logs on the client</text>
<text x="70" y="3272" class="sec">07 / STRATEGY · THE PARTNER VIEW</text>
<text x="1530" y="3272" class="s d" text-anchor="end">the private layer · reads everything, is read by no one else</text>

<text x="94" y="3411" class="s">pricing           retainer bands, hourly floor, scope rules</text>
<text x="94" y="3438" class="s">profitability     fees vs hours per client · from your billing export</text>
<text x="94" y="3465" class="s">capacity          who is loaded when · season plan · hiring</text>
<text x="94" y="3492" class="s">client-tiers      A/B/C by fee, risk, payment habit</text>
<text x="94" y="3519" class="s">decisions         what we decided, when, why · never deleted</text>
<text x="94" y="3546" class="s">referrals         who sends work, who we send to</text>
<text x="94" y="3580" class="xs d">numbers are imported, not invented · every figure keeps its source file</text>
<rect x="830" y="3308" width="700" height="290" class="bx-gate"/>
<text x="854" y="3348" class="lab gate">QUESTIONS THE PARTNER ASKS THE BRAIN</text>
<text x="854" y="3384" class="s">· which clients take the most hours for the least fee?</text>
<text x="854" y="3411" class="s">· who is overloaded in the september audit season?</text>
<text x="854" y="3438" class="s">· which service line grew this year, which shrank?</text>
<text x="854" y="3465" class="s">· which clients have an open notice or a late payment?</text>
<text x="854" y="3492" class="s">· what did we decide about scope creep in march, and why?</text>
<text x="854" y="3519" class="s">· which templates have not been reviewed in a year?</text>
<text x="854" y="3546" class="s">· which positions do we take that a new circular affects?</text>
<text x="854" y="3580" class="xs d">answers cite pages · the brain says &#x27;not in the brain&#x27; instead of guessing</text>

<line x1="70" y1="4812" x2="1530" y2="4812" class="rule"/>

<text x="92" y="4949" class="lab">EVERY QUARTER</text>

<text x="70" y="5302" class="sec">12 / NOT IN THE BOX · NON-NEGOTIABLES</text>
<rect x="70" y="5338" width="710" height="258" class="bx"/>
<text x="92" y="5374" class="lab">NOT IN THE BOX · BUILD IT OR KEEP YOUR TOOL</text>
<text x="92" y="5408" class="s">· no tally, GST-portal or income-tax-portal connector:</text>
<text x="92" y="5434" class="s">  small collectors drop exports into sources/ on a schedule</text>
<text x="92" y="5460" class="s">· not a billing, time-sheet or document system: those stay,</text>
<text x="92" y="5486" class="s">  the brain imports their exports and links the facts</text>
<text x="92" y="5512" class="s">· no per-user access rules inside one brain: split brains</text>
<text x="92" y="5538" class="s">· no local embedding model yet: semantic search uses the</text>
<text x="92" y="5564" class="s">  OpenAI embedding API · keyword + graph mode needs nothing</text>
<rect x="820" y="5338" width="710" height="258" class="bx-never"/>
<text x="842" y="5374" class="lab never">THE BRAIN NEVER</text>
<text x="842" y="5408" class="s">✕ files a return or sends a reply without a CA&#x27;s yes</text>
<text x="842" y="5434" class="s">✕ invents a number, a section, a date or a fee</text>
<text x="842" y="5460" class="s">✕ shows a figure without the source it came from</text>
<text x="842" y="5486" class="s">✕ shares a login: one person, one key</text>
<text x="842" y="5512" class="s">✕ lets client data leave the firm&#x27;s server</text>
<text x="842" y="5538" class="s">✕ keeps passwords, OTPs or DSC PINs in any page</text>
<text x="842" y="5564" class="s">✕ answers from outside the brain without saying so</text>
<text x="70" y="5670" class="sec">EXAMPLE · ONE MONTH FOR ONE CLIENT, START TO FINISH</text>
<text x="70" y="5714">1  1 oct: the night job spawns widget traders&#x27; GSTR-3B job for september, owner article a, due 20 oct</text>
<text x="70" y="5748">2  the morning list shows it · on 15 oct books arrive, the brain pulls 2B, runs the match, two bills are missing</text>
<text x="70" y="5782">3  the agent fills client-query-gst v2 from the client page · the manager says yes · the client replies in a day</text>
<text x="70" y="5816">4  the draft 3B and workings go to the manager ◆ · she changes one head · the partner files it from the firm login</text>
<text x="70" y="5850">5  ARN, date and &#x27;bill with quarter&#x27; land on the client timeline · the correction becomes a lesson line</text>
<text x="70" y="5884">6  28 oct: an ASMT-10 arrives · filed under the client, template v4 pulled, last year&#x27;s position found, reply due 14 nov</text>
<text x="70" y="5918">7  monday memo: 1 return filed, 1 notice open, 11 hours on a retainer client this month, fee realisation flagged</text>
